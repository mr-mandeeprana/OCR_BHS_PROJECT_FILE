# ============================================================
# OCR_BHS PROJECT - CENTRAL CONFIGURATION
# ============================================================
#
# Lines marked  [CHANGED]  differ from the previous config and are
# the ones that fix the missing / jumping tracking box.
# Lines marked  [NEW]      are new keys.

project:
  name: "OCR_BHS"
  version: "1.0.0"
  environment: "development"
  log_level: "INFO"

# ============================================================
# CAMERAS
# ============================================================

cameras:

  camera_1:
    enabled: true
    # rtsp = live camera
    # video = recorded video for testing
    source_type: "rtsp"

    # Used when source_type = rtsp
    source_env: "CAMERA_1_RTSP"

    # Used when source_type = video
    # video_source: "videos/input/camera_1_test.mp4"

    name: "Camera 1"
    reconnect: true
    reconnect_delay: 2

    # Keep buffer small for minimum latency
    buffer_size: 3

    # 0 = use camera/video native FPS
    target_fps: 20

    # Loop recorded video when testing.
    # (When the video restarts, the tag "teleports" back to its start
    #  position; the tracker will drop the old track and start a new one.
    #  That is expected and not a tracking bug.)
    video_loop: true

  camera_2:
    enabled: false
    source_type: "rtsp"
    source_env: "CAMERA_2_RTSP"
    video_source: "videos/input/camera_2_test.mp4"
    name: "Camera 2"
    reconnect: true
    reconnect_delay: 2
    buffer_size: 1
    target_fps: 0
    video_loop: true

  camera_3:
    enabled: false
    source_type: "rtsp"
    source_env: "CAMERA_3_RTSP"
    video_source: "videos/input/camera_3_test.mp4"
    name: "Camera 3"
    reconnect: true
    reconnect_delay: 2
    buffer_size: 1
    target_fps: 0
    video_loop: true

  camera_4:
    enabled: false
    source_type: "rtsp"
    source_env: "CAMERA_4_RTSP"
    video_source: "videos/input/camera_4_test.mp4"
    name: "Camera 4"
    reconnect: true
    reconnect_delay: 2
    buffer_size: 1
    target_fps: 0
    video_loop: true

# ============================================================
# DETECTION
# ============================================================

detection:
  enabled: true

  # YOLO model
  model_path: "models/yolo/iata_tag_yolo26n_best.pt"

  # [CHANGED] 0.30 -> 0.12
  # YOLO must also report LOW-confidence boxes (blurred / partly
  # hidden tags). ByteTrack uses boxes between 0.10 and the
  # activation threshold ONLY to keep an already-existing track
  # alive - they can never start a new track (that needs
  # tracking.new_track_thresh). With 0.30 here, ByteTrack's
  # low-score rescue stage never received anything, so the box
  # vanished every time the tag blurred.
  confidence: 0.12

  # YOLO speed is the most important number for smooth tracking.
  # Aim for >= 8-10 detections/second per camera (check the
  # "detection_runs" stat). If it is lower, reduce this to 512 or
  # crop to the conveyor area. Do NOT raise it unless YOLO is fast.
  image_size: 640
  device: "cpu"

  classes:
    - 0

  # IATA tag class
  class_names:
    0: "iata_tag"

  half: false
  max_det: 20

# ============================================================
# PREPROCESSING
# ============================================================

preprocessing:

  crop:
    enabled: true
    padding: 10
    min_width: 20
    min_height: 20

  image_quality:
    enabled: true
    min_score: 40.0
    blur_threshold: 50.0
    brightness_min: 30.0
    brightness_max: 230.0

  resize:
    enabled: true
    width: 640
    height: 640

# ============================================================
# TRACKING
# ============================================================
#
# How it works now:
#   * ByteTrack (supervision) only decides WHICH box is WHICH tag.
#   * A per-track Kalman filter produces the displayed, smoothed box.
#   * tracker.update()  runs once per NEW YOLO result.
#   * tracker.predict() runs on EVERY camera frame, so the box
#     glides with the tag between YOLO results.
#
# All "buffer / miss / hits" counters below are counted in YOLO
# RESULTS (not camera frames).

tracking:

  enabled: true

  # Tracker implementation
  tracker: "bytetrack"

  # ----------------------------------------------------------
  # ByteTrack detection thresholds
  # ----------------------------------------------------------

  track_high_thresh: 0.30

  # Pre-filter before ByteTrack (ByteTrack itself ignores < 0.10).
  track_low_thresh: 0.05

  # Minimum confidence to START a new track. Now exact (the tracker
  # compensates for supervision's hidden +0.10 offset).
  # Keep this >= detection.confidence.
  new_track_thresh: 0.30

  # ----------------------------------------------------------
  # Track lifetime
  # ----------------------------------------------------------

  # [CHANGED] 45 -> 30
  # YOLO results a lost track stays alive inside ByteTrack
  # (~3 s at ~10 detections/s).
  track_buffer: 30

  # [CHANGED] 0.85 -> 0.95
  # More forgiving association when the tag moves far between two
  # YOLO results (fast conveyor / slow YOLO). In tests this was the
  # difference between losing the tag and keeping it when YOLO ran
  # at <= 6 detections/second. It did not cause ID swaps for two
  # parallel tags.
  match_thresh: 0.95

  # Fuse detection confidence into association score.
  fuse_score: true

  # ----------------------------------------------------------
  # Track confirmation
  # ----------------------------------------------------------

  # [CHANGED] 3 -> 2
  # Real YOLO detections needed before a track is confirmed
  # (eligible for OCR/barcode). ByteTrack itself outputs a new
  # track from its 2nd detection, so 2 here = confirmed on the
  # 3rd detection (~0.3 s).
  min_hits: 2

  # ----------------------------------------------------------
  # Prediction (drawing the box while YOLO misses the tag)
  # ----------------------------------------------------------

  # [CHANGED] 18 -> 12
  # Consecutive missed YOLO results the box is still drawn for.
  prediction_buffer: 12

  # [NEW] Hard cap in SECONDS on drawing a box with no real
  # detection, regardless of prediction_buffer.
  max_coast_seconds: 1.0

  # [NEW] While coasting, the box velocity halves every N seconds
  # so a vanished tag does not drift away forever.
  coast_velocity_half_life: 1.0

  # ----------------------------------------------------------
  # Smoothing (Kalman filter)  [NEW]
  # ----------------------------------------------------------

  # Expected YOLO centre jitter as a fraction of sqrt(width*height).
  # Higher = smoother box but slightly slower reaction.
  measurement_noise_ratio: 0.03

  # Expected tag acceleration noise in px/s^2.
  # Lower  (100-200) = very steady, straight-line box.
  # Higher (500-1000) = follows sudden stops / speed-ups faster.
  process_noise_accel: 300.0

  # Width/height smoothing (0..1). Lower = steadier box size.
  size_smoothing: 0.35

  # Velocities below this (px/s) are treated as "standing still".
  min_render_speed: 5.0

  # ----------------------------------------------------------
  # Tracking stability (diagnostic flags only)
  # ----------------------------------------------------------

  # Max centre movement between two YOLO results before the
  # "motion jump" flag is raised.
  max_jump_distance: 200.0

  # IoU below this value can indicate unstable association.
  min_iou_warning: 0.10

  # Number of unstable YOLO results before instability is reported.
  unstable_frame_threshold: 5

  # ----------------------------------------------------------
  # Detection filtering (output-side only)
  # ----------------------------------------------------------

  min_bbox_area: 100
  min_track_confidence: 0.03

  # ----------------------------------------------------------
  # Legacy keys (read by older code paths; not used by the
  # Kalman smoothing)
  # ----------------------------------------------------------

  velocity_smoothing: 0.70
  history_size: 300

# ============================================================
# BARCODE
#
# Existing barcode_engine.py and
# barcode_region_processor.py are used.
# ============================================================

barcode:
  enabled: true
  engine: "pyzbar"

  primary_format: "CODE128"

  fallback_formats:
    enabled: true
    formats:
      - "CODE128"
      - "CODE39"
      - "CODE93"
      - "I25"
      - "EAN13"
      - "EAN8"
      - "UPCA"
      - "UPCE"

  processing:
    upscale: 3.0
    max_variants: 30

    rotations:
      enabled: true
      angles:
        - 0
        - 90
        - 180
        - 270

    clahe:
      enabled: true
      clip_limit: 2.5
      tile_grid_size: 8

    sharpening:
      enabled: true
      sigma: 1.2
      amount: 1.8

    thresholding:
      otsu: true
      adaptive: true

      fixed:
        enabled: true
        values:
          - 80
          - 100
          - 120
          - 140
          - 160
          - 180
          - 200

  region:
    enabled: true
    max_regions: 8

    min_area: 250
    min_area_ratio: 0.008
    max_area_ratio: 0.65

    min_aspect_ratio: 1.4
    max_aspect_ratio: 20.0

    min_fill_ratio: 0.04
    iou_deduplication: 0.60
    padding_ratio: 0.08

  consensus:
    enabled: true
    minimum_confidence: 0.70

  worker:
    enabled: true
    count: 2
    queue_size: 50

  duplicate_suppression:
    enabled: true
    cooldown_seconds: 3.0

# ============================================================
# OCR
# ============================================================

ocr:
  enabled: true
  engine: "paddle"

  languages:
    - "en"

  processing:
    rotations:
      - 0
      - 90
      - 180
      - 270

  worker:
    enabled: true
    count: 2
    queue_size: 50

# ============================================================
# VALIDATION
# ============================================================

validation:
  enabled: true

  iata:
    enabled: true

    # Example:
    # ABC1234567
    min_length: 3
    max_length: 20

  barcode_ocr:
    require_barcode: false
    require_ocr: false
    agreement_required: false

# ============================================================
# BACKGROUND PROCESSING
# ============================================================

processing:
  asynchronous: true

  # [NEW] (was an invisible hard-coded 0.20 s in pipeline.py, i.e.
  # YOLO limited to ~5 FPS - the main cause of the jumping box.)
  # Minimum seconds between two YOLO inference starts on the
  # detector thread. 0.0 = run back-to-back as fast as the CPU
  # allows (smoothest). Raise to e.g. 0.05 only if the CPU is
  # saturated and OCR/barcode workers are starving.
  detection_interval: 0.0

  # [NEW] Explicit values (these were the code defaults).
  ocr_interval: 0.5
  barcode_interval: 0.5

  queue:
    max_size: 100

  best_frame:
    enabled: true
    frames_per_track: 5
    minimum_quality_score: 40.0

  duplicate_processing:
    enabled: true
    process_once_per_track: true
    retry_failed_results: true
    max_ocr_attempts: 3
    max_barcode_attempts: 3

# ============================================================
# WORKERS
# ============================================================

workers:

  barcode:
    enabled: true
    count: 2

  ocr:
    enabled: true
    count: 2

  validation:
    enabled: true
    count: 1

  result:
    enabled: true
    count: 1

# ============================================================
# PIPELINE
# ============================================================

pipeline:
  mode: "live"

  continuous_detection: true
  continuous_tracking: true

  asynchronous_ocr: true
  asynchronous_barcode: true

  stop_on_camera_failure: false

  graceful_shutdown_timeout: 10

# ============================================================
# DATABASE
# ============================================================

database:
  enabled: true
  type: "sqlserver"

  host_env: "DB_HOST"
  port: 1433

  database_env: "DB_NAME"
  username_env: "DB_USERNAME"
  password_env: "DB_PASSWORD"

  connection_timeout: 10

  insert_results: true

  driver: "ODBC Driver 18 for SQL Server"
  encrypt: "yes"
  trust_server_certificate: "yes"

# ============================================================
# PATHS
# ============================================================

paths:

  models: "models"

  captures: "captures"
  raw_captures: "captures/raw"
  tag_captures: "captures/tags"
  barcode_captures: "captures/barcode"
  ocr_captures: "captures/ocr"

  failed: "failed"
  failed_detection: "failed/detection"
  failed_barcode: "failed/barcode"
  failed_ocr: "failed/ocr"
  failed_validation: "failed/validation"

  output: "output"
  output_detections: "output/detections"
  output_tracking: "output/tracking"
  output_barcode: "output/barcode"
  output_ocr: "output/ocr"
  output_validation: "output/validation"
  output_logs: "output/logs"

  videos_input: "videos/input"
  videos_output: "videos/output"

  logs: "logs"

# ============================================================
# DEBUG
# ============================================================

debug:
  enabled: true

  save_frames: false
  save_detection_frames: false
  save_tracking_frames: false
  save_failed_frames: true

  display_window: false

  video_test:
    enabled: false
    source: "videos/input/test_video.mp4"

# ============================================================
# PERFORMANCE
# ============================================================

performance:

  # Small queue = low latency
  frame_queue_size: 2

  # Always prefer newest frame
  drop_old_frames: true

  # [REMOVED] max_tracking_fps - no longer used. The tracker's
  # per-frame predict() is only a few microseconds per track and
  # now runs once per camera frame.

  # One shared YOLO model.
  # NOTE: inference calls are serialized by a lock, so with
  # several cameras enabled the YOLO throughput is SHARED between
  # them (4 cameras at ~11 detections/s total = ~3/s each, which
  # is too slow for smooth tracking). For more than 1-2 cameras,
  # use shared_model: false (one model per camera) or a GPU.
  shared_model: true

  max_camera_threads: 4

  measure_fps: true
  measure_latency: true

# ============================================================
# LOGGING
# ============================================================

logging:

  enabled: true
  console: true
  file: true

  directory: "logs"

  files:
    application: "logs/application/application.log"
    camera: "logs/camera/camera.log"
    detection: "logs/detection/detection.log"
    ocr: "logs/ocr/ocr.log"
    database: "logs/database/database.log"

  rotation:
    enabled: true
    max_size_mb: 10
    backup_count: 5